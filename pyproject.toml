[project]
name = "llm-scrabble-bench"
version = "0.1.0"
description = "Minimal prototype for a formal-language Scrabble-style LLM benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "automata-lib>=8.0.0",
    "litellm>=1.88.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.4",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "openai>=1.75.0",
    "ortools>=9.14.0",
    "pillow>=12.0.0",
    "plotly>=5.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "tqdm>=4.67.0",
    "ipykernel>=7.2.0",
    "openrouter>=0.9.2",
]

[project.scripts]
generate = "src.cli:main"
check-model = "src.tools.check_model:main"
sample-grammar = "src.formal.grammar.cli:cmd_sample"
analyze-grammar = "src.formal.grammar.cli:cmd_analyze"
prepare = "src.evaluation.cli:cmd_prepare"
evaluate = "src.evaluation.cli:cmd_evaluate"
decompose = "src.evaluation.cli:cmd_decompose"

[tool.hatch.build.targets.wheel]
packages = ["src", "visualization"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
