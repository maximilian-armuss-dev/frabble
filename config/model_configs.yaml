models:
  - name: gpt-5-mini
    model: openai/gpt-5-mini
    api_key_env: OPENAI_API_KEY
    temperature: 1
    reasoning_effort: low
    timeout_seconds: 120

  - name: gpt-5
    model: openai/gpt-5
    api_key_env: OPENAI_API_KEY
    temperature: 1
    reasoning_effort: high
    timeout_seconds: 120

  - name: anthropic_sonnet-4-5
    model: anthropic/claude-sonnet-4-5-20250929
    api_key_env: ANTHROPIC_API_KEY
    temperature: 1
    timeout_seconds: 120
