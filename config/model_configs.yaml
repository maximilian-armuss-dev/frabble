defaults:
  temperature: 1
  max_completion_tokens: 60000
  reasoning_effort: high
  timeout_seconds: 3600

models:
  - name: sol
    model: openrouter/openai/gpt-6.1-sol
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: openai

  - name: opus
    model: openrouter/anthropic/claude-opus-5.5
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: anthropic

  - name: gemini
    model: openrouter/google/gemini-3.1-pro-preview
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: google-ai-studio

  - name: grok
    model: openrouter/x-ai/grok-4.7
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: xai

  - name: deepseek
    model: openrouter/deepseek/deepseek-v4-pro-0813
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: nebius/fp8

  - name: glm
    model: openrouter/z-ai/glm-5.3
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: parasail/fp8

  - name: qwen
    model: openrouter/qwen/qwen3.8-max-0902
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: alibaba

  - name: muse
    model: openrouter/meta/muse-spark-1.3
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: meta

  - name: mimo
    model: openrouter/xiaomi/mimo-v2.6-pro
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    provider: xiaomi/fp8
    # Accepts the inherited high setting; distinct effort levels are unconfirmed.
